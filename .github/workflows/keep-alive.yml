name: Keep backend alive

# Render's free tier spins down the web service after ~15 minutes of
# inactivity, causing a slow "cold start" on the next real request.
# This workflow pings the health endpoint often enough to prevent that.
#
# Note: GitHub disables scheduled workflows automatically after 60 days
# of NO repository activity (commits/pushes) — not an issue for an
# actively developed repo. Also, `schedule` times are best-effort and can
# be delayed a few minutes during GitHub-wide high load.

on:
  schedule:
    # Offset from round numbers (not :00/:10/:20...) since GitHub's queue is
    # most congested right at those boundaries, which delays exact-round
    # cron schedules the most. Still effectively every ~10 minutes.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {} # allows manual "Run workflow" trigger too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://andatests.onrender.com/api/health
